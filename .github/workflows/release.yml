name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    # Manual releases must select a version tag, never a branch.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Tag ${process.env.RELEASE_TAG} does not match package version v${version}`);
          }
          JS
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm test
      - name: prepare prebuilt npm distribution
        env:
          DIST_DIR: ${{ runner.temp }}/distribution
        run: node scripts/prepare-release.mjs "$DIST_DIR"
      - name: smoke install prebuilt package
        working-directory: ${{ runner.temp }}/distribution
        env:
          INSTALL_PREFIX: ${{ runner.temp }}/npm-install
        run: |
          PACKAGE=$(npm pack --pack-destination "$RUNNER_TEMP")
          npm install --global --prefix "$INSTALL_PREFIX" "$RUNNER_TEMP/$PACKAGE"
          "$INSTALL_PREFIX/bin/dt" --help
          test "$("$INSTALL_PREFIX/bin/dt" hash abc)" = \
            "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-distribution
          path: ${{ runner.temp }}/distribution
          if-no-files-found: error

  distribution:
    name: publish prebuilt release branch
    needs: verify
    # Keep the install branch on stable releases; prereleases remain source tags.
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: npm-distribution
          path: ${{ runner.temp }}/distribution
      - name: publish distribution without changing source tags
        env:
          DIST_DIR: ${{ runner.temp }}/distribution
          RELEASE_REPO: ${{ runner.temp }}/release-repo
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/release; then
            git worktree add --detach "$RELEASE_REPO" origin/release
          else
            git worktree add --detach "$RELEASE_REPO" HEAD
            git -C "$RELEASE_REPO" checkout --orphan release
          fi
          git -C "$RELEASE_REPO" rm -rf --ignore-unmatch .
          cp -R "$DIST_DIR"/. "$RELEASE_REPO"/
          git -C "$RELEASE_REPO" add .
          if git -C "$RELEASE_REPO" diff --cached --quiet; then
            echo "Distribution is already current."
            exit 0
          fi
          git -C "$RELEASE_REPO" -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "release $RELEASE_TAG" -m "source: $SOURCE_SHA"
          git -C "$RELEASE_REPO" push origin HEAD:refs/heads/release

  image:
    name: publish multi-architecture image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
          provenance: mode=max
          sbom: true
      - name: attest provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
