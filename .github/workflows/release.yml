name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    # Manual releases must select a version tag, never a branch.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: verify tag matches crate version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Tag $RELEASE_TAG does not match crate version v$version" >&2
            exit 1
          fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: smoke built binary
        shell: bash
        run: |
          exe=target/${{ matrix.target }}/release/dt
          if [ "${{ runner.os }}" = "Windows" ]; then exe="$exe.exe"; fi
          "$exe" --help
          test "$("$exe" hash abc)" = "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"
      - name: package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          name="dt-${TAG}-${TARGET}"
          mkdir "$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${TARGET}/release/dt.exe" "$name/"
          else
            cp "target/${TARGET}/release/dt" "$name/"
          fi
          cp README.md "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            archive="$name.zip"
            7z a -tzip "$archive" "$name"
          else
            archive="$name.tar.gz"
            tar czf "$archive" "$name"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
      - name: installer with pinned default version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir baked
          sed "s|^DEFAULT_VERSION=.*|DEFAULT_VERSION=\"$TAG\"|" install.sh > baked/install.sh
          grep -qx "DEFAULT_VERSION=\"$TAG\"" baked/install.sh
          chmod +x baked/install.sh
      - name: checksums
        run: |
          cat dt-*.sha256 > SHA256SUMS
          (cd baked && sha256sum install.sh) >> SHA256SUMS
      - name: attest provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dt-*.tar.gz
            dt-*.zip
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dt-* baked/install.sh SHA256SUMS --clobber
          else
            flags=""
            case "$TAG" in *-*) flags="--prerelease" ;; esac
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes $flags dt-* baked/install.sh SHA256SUMS
          fi

  image:
    name: publish multi-architecture image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*-linux-musl
          merge-multiple: true
          path: musl
      - name: stage docker context
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p docker-context/amd64 docker-context/arm64
          tar xzf "musl/dt-${TAG}-x86_64-unknown-linux-musl.tar.gz" -C musl
          tar xzf "musl/dt-${TAG}-aarch64-unknown-linux-musl.tar.gz" -C musl
          cp "musl/dt-${TAG}-x86_64-unknown-linux-musl/dt" docker-context/amd64/dt
          cp "musl/dt-${TAG}-aarch64-unknown-linux-musl/dt" docker-context/arm64/dt
          cp Dockerfile docker-context/Dockerfile
      - uses: docker/setup-buildx-action@v4
      - name: log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
      - name: attest provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
