name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # engines: ^22.13.0 || >=23.5.0 (Node 20 lacks Promise.withResolvers)
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: build container
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: dev-tools:smoke
          cache-from: type=gha,scope=ci-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-image-${{ matrix.arch }}
      - name: smoke CLI and Git dependencies
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} dev-tools:smoke --help
          docker run --rm --platform linux/${{ matrix.arch }} dev-tools:smoke syncgit --help
          docker run --rm --platform linux/${{ matrix.arch }} --entrypoint sh dev-tools:smoke \
            -c 'git --version && ssh -V && test "$(id -u)" -ne 0'
