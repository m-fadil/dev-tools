name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --no-fail-fast

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh
      - name: pinned default version is substituted
        run: |
          sed 's|^DEFAULT_VERSION=.*|DEFAULT_VERSION="v9.9.9"|' install.sh > pinned.sh
          grep -qx 'DEFAULT_VERSION="v9.9.9"' pinned.sh
          sh -n pinned.sh
      - name: installs the latest published binary and verifies it
        run: |
          DT_VERSION=v1.0.0-rc.1 DT_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/dt" hash abc

  container:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: stage docker context
        run: |
          mkdir -p docker-context/${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/dt docker-context/${{ matrix.arch }}/dt
          cp Dockerfile docker-context/Dockerfile
      - name: build container
        run: docker build --build-arg TARGETARCH=${{ matrix.arch }} -t dev-tools:smoke docker-context
      - name: smoke CLI and Git dependencies
        run: |
          docker run --rm dev-tools:smoke --help
          docker run --rm dev-tools:smoke syncgit --help
          docker run --rm --entrypoint sh dev-tools:smoke \
            -c 'git --version && ssh -V && test "$(id -u)" -ne 0'
